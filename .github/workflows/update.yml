name: Auto Update Live and EPG

on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 时间 0 点（北京时间早上 8 点）自动运行一次
  workflow_dispatch: # 支持在 GitHub 界面手动点击运行

jobs:
  update-assets:
    runs-on: ubuntu-latest
    steps:
      - name: 迁出代码仓库
        uses: actions/checkout@v4

      - name: 下载并处理 EPG 或直播源
        run: |
          # 创建 output 存储文件夹
          mkdir -p output
          
          # 自动下载 51zmt 的精简版 EPG (cc.xml)
          curl -o output/e.xml http://epg.51zmt.top:8000/cc.xml

      - name: 自动提交并推送到仓库
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add output/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update EPG and live sources [skip ci]" && git push)
